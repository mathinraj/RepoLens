<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoLens</title>
    <link rel="icon" href="../icons/search-compass.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
            <circle cx="56" cy="55" r="34" fill="none" stroke="var(--accent, #38BDF8)" stroke-width="9"/>
            <path d="m81 80 25 25" stroke="var(--accent, #38BDF8)" stroke-width="12" stroke-linecap="round"/>
            <path d="M56 26v10M56 74v10M27 55h10M75 55h10" stroke="var(--accent-tick, #2DD4BF)" stroke-width="6" stroke-linecap="round"/>
            <path d="m50 43-12 12 12 12M62 43l12 12-12 12" fill="none" stroke="var(--fg, #1f2328)" stroke-width="7" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>RepoLens</h1>
          <p id="page-label" class="page-label">Detecting page…</p>
        </div>
      </div>
      <div class="header-right">
        <div class="header-top">
          <span id="page-badge" class="page-badge" data-type="unknown">…</span>
          <button
            type="button"
            id="settings-btn"
            class="icon-btn"
            title="Preferences"
            aria-label="Open preferences"
          >
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path fill="currentColor" d="M8 10a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm0-1.5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1Z"/>
              <path fill="currentColor" d="M6.94 1.5c-.4 0-.74.28-.82.67l-.17.86a5.6 5.6 0 0 0-.9.52l-.83-.3a.83.83 0 0 0-1 .37l-1.06 1.83c-.2.35-.12.8.2 1.04l.7.53a5.7 5.7 0 0 0 0 1.04l-.7.53c-.32.24-.4.69-.2 1.04l1.06 1.83c.2.35.63.5 1 .37l.83-.3c.28.2.58.38.9.52l.17.86c.08.39.42.67.82.67h2.12c.4 0 .74-.28.82-.67l.17-.86c.32-.14.62-.32.9-.52l.83.3c.37.13.8-.02 1-.37l1.06-1.83c.2-.35.12-.8-.2-1.04l-.7-.53a5.7 5.7 0 0 0 0-1.04l.7-.53c.32-.24.4-.69.2-1.04l-1.06-1.83a.83.83 0 0 0-1-.37l-.83.3a5.6 5.6 0 0 0-.9-.52l-.17-.86a.83.83 0 0 0-.82-.67H6.94Zm.42 1.5h1.28l.2 1.04c.03.16.15.3.3.35.4.14.78.36 1.1.64.13.1.3.14.46.08l1-.36.64 1.1-.85.64c-.13.1-.2.26-.17.42a4.2 4.2 0 0 1 0 1.26c-.03.16.04.32.17.42l.85.64-.64 1.1-1-.36a.42.42 0 0 0-.46.08c-.32.28-.7.5-1.1.64a.42.42 0 0 0-.3.35l-.2 1.04H7.36l-.2-1.04a.42.42 0 0 0-.3-.35 4.1 4.1 0 0 1-1.1-.64.42.42 0 0 0-.46-.08l-1 .36-.64-1.1.85-.64c.13-.1.2-.26.17-.42a4.2 4.2 0 0 1 0-1.26.42.42 0 0 0-.17-.42l-.85-.64.64-1.1 1 .36c.16.06.33.02.46-.08.32-.28.7-.5 1.1-.64a.42.42 0 0 0 .3-.35l.2-1.04Z"/>
            </svg>
          </button>
        </div>
        <div class="mode-toggle" role="group" aria-label="Answer mode">
          <button type="button" class="mode-btn is-active" data-mode="instant">
            Instant
          </button>
          <button type="button" class="mode-btn" data-mode="deep">
            Deep
          </button>
          <div class="mode-tip" id="mode-tip" aria-hidden="true"></div>
        </div>
      </div>
    </header>

    <section class="questions-section" aria-label="Suggested questions">
      <button type="button" id="questions-toggle" class="questions-toggle" aria-expanded="true">
        <svg class="chevron" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
          <path fill="currentColor" d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z"/>
        </svg>
        <span class="section-label">Suggested questions</span>
      </button>
      <div id="questions-body" class="questions-body">
        <div id="question-chips" class="question-chips"></div>
        <p id="questions-empty" class="questions-empty is-hidden">
          No suggested questions for this page — ask anything below.
        </p>
      </div>
    </section>

    <section class="answer-section" aria-live="polite">
      <div class="conversation-header is-hidden" id="conversation-header">
        <span class="section-label">Conversation</span>
        <button type="button" id="clear-btn" class="clear-btn" title="Clear this conversation">
          Clear
        </button>
      </div>
      <div id="conversation" class="conversation">
        <div class="empty-state" id="empty-state">
          Pick a suggested question or type your own to get started.
        </div>
      </div>
    </section>

    <footer class="composer">
      <form id="ask-form" class="ask-form" autocomplete="off">
        <textarea
          id="question-input"
          class="question-input"
          rows="2"
          placeholder="Ask about this page…"
          maxlength="2000"
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn" aria-label="Send question">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M1.22 1.05a.75.75 0 0 1 .8-.12l12.5 5.25a.75.75 0 0 1 0 1.38L2.02 12.8a.75.75 0 0 1-1.02-.9l1.8-4.15L.98 3.7a.75.75 0 0 1 .24-2.65Zm2.5 5.7L2.4 10.1l8.4-3.53-7.08-.82Zm7.08-2.28L2.72 5.56l.9-2.08 7.18 3z"
            />
          </svg>
        </button>
      </form>
    </footer>

    <script src="vendor/marked.min.js"></script>
    <script src="../shared/constants.js"></script>
    <script src="../shared/questions.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
