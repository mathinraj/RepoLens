<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoLens</title>
    <link rel="icon" href="../icons/search-compass.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
            <circle cx="56" cy="55" r="34" fill="none" stroke="var(--accent, #38BDF8)" stroke-width="9"/>
            <path d="m81 80 25 25" stroke="var(--accent, #38BDF8)" stroke-width="12" stroke-linecap="round"/>
            <path d="M56 26v10M56 74v10M27 55h10M75 55h10" stroke="var(--accent-tick, #2DD4BF)" stroke-width="6" stroke-linecap="round"/>
            <path d="m50 43-12 12 12 12M62 43l12 12-12 12" fill="none" stroke="var(--fg, #1f2328)" stroke-width="7" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>RepoLens</h1>
          <p id="page-label" class="page-label">Detecting page…</p>
        </div>
      </div>
      <div class="header-right">
        <span id="page-badge" class="page-badge" data-type="unknown">…</span>
        <div class="mode-toggle" role="group" aria-label="Answer mode">
          <button
            type="button"
            class="mode-btn is-active"
            data-mode="instant"
            title="Fast answer from this page's context"
          >
            Instant
          </button>
          <button
            type="button"
            class="mode-btn"
            data-mode="enhanced"
            title="Deeper answer using broader repo context"
          >
            Enhanced
          </button>
        </div>
      </div>
    </header>

    <section class="questions-section" aria-label="Suggested questions">
      <div class="section-label">Suggested questions</div>
      <div id="question-chips" class="question-chips"></div>
      <p id="questions-empty" class="questions-empty is-hidden">
        No suggested questions for this page — ask anything below.
      </p>
    </section>

    <section class="answer-section" aria-live="polite">
      <div class="conversation-header is-hidden" id="conversation-header">
        <span class="section-label">Conversation</span>
        <button type="button" id="clear-btn" class="clear-btn" title="Clear this conversation">
          Clear
        </button>
      </div>
      <div id="conversation" class="conversation">
        <div class="empty-state" id="empty-state">
          Pick a suggested question or type your own to get started.
        </div>
      </div>
    </section>

    <footer class="composer">
      <form id="ask-form" class="ask-form" autocomplete="off">
        <textarea
          id="question-input"
          class="question-input"
          rows="2"
          placeholder="Ask about this page…"
          maxlength="2000"
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn" aria-label="Send question">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M1.22 1.05a.75.75 0 0 1 .8-.12l12.5 5.25a.75.75 0 0 1 0 1.38L2.02 12.8a.75.75 0 0 1-1.02-.9l1.8-4.15L.98 3.7a.75.75 0 0 1 .24-2.65Zm2.5 5.7L2.4 10.1l8.4-3.53-7.08-.82Zm7.08-2.28L2.72 5.56l.9-2.08 7.18 3z"
            />
          </svg>
        </button>
      </form>
    </footer>

    <script src="vendor/marked.min.js"></script>
    <script src="../shared/constants.js"></script>
    <script src="../shared/questions.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
